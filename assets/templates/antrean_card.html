<div class="zone-card" style="border-left-color:{{warna}}; padding:14px 18px; margin-bottom:8px;">
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
        <b style="color:#e6f1ff;">{{report_id}} &middot; {{lokasi}}</b>
        <span style="color:#8892b0; font-size:0.85rem;">{{waktu}} &middot; {{pelapor}}</span>
    </div>
    <div class="meta" style="margin-top:6px;">
        <div><b>AI</b>{{ai}}</div>
        <div><b>PELAPOR</b>{{kategori}}</div>
        <div><b>KONDISI</b>{{kondisi}}</div>
    </div>
    <div style="color:{{warna}}; font-size:0.85rem; margin-top:6px;">{{keterangan}}</div>
</div>
